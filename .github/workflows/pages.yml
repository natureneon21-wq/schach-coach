# KI-generierter Code / AI-generated code: erstellt von Claude (Anthropic) im Vibe-Coding-Verfahren.
# Deployt die App auf GitHub Pages und holt Stockfish (GPLv3) beim Deploy aus dem npm-Paket.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: App-Dateien und Stockfish zusammenstellen
        run: |
          set -e
          SRC=schach-coach-slim
          if [ -f index.html ]; then SRC=.; fi
          mkdir -p _site
          cp -r "$SRC"/. _site/
          rm -rf _site/.github _site/.git
          mkdir -p _site/vendor /tmp/sf
          cd /tmp/sf
          npm pack stockfish@17.1
          tar -xzf stockfish-*.tgz
          JS=$(ls package/src/*lite-single*.js | head -n 1)
          WASM=$(ls package/src/*lite-single*.wasm | head -n 1)
          echo "Engine: $JS / $WASM"
          cd "$GITHUB_WORKSPACE"
          cp "/tmp/sf/$JS" _site/vendor/stockfish.js
          cp "/tmp/sf/$WASM" _site/vendor/stockfish.wasm
          ls -la _site _site/vendor

      - name: Wissensdatenbank bauen (freie Schachquellen, nicht im Repo gespeichert)
        run: |
          SRC=schach-coach-slim
          if [ -f index.html ]; then SRC=.; fi
          node "$SRC/tools/build-wissen.mjs" _site/wissen || echo "Wissensdatenbank konnte nicht gebaut werden"
          rm -rf _site/tools
          du -sh _site/wissen || true

      - name: PDF.js holen (für eigene PDFs, Apache-2.0)
        run: |
          mkdir -p /tmp/pdfjs _site/vendor
          cd /tmp/pdfjs
          npm pack pdfjs-dist@4.10.38 && tar -xzf pdfjs-dist-*.tgz
          cd "$GITHUB_WORKSPACE"
          cp /tmp/pdfjs/package/build/pdf.min.mjs /tmp/pdfjs/package/build/pdf.worker.min.mjs _site/vendor/ || echo "PDF.js nicht verfügbar"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
